name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── Restore previous data (for fallback & incremental) ───────────
      - name: Restore previous version data from page branch
        run: |
          git fetch origin page --depth=1 2>/dev/null || true
          if git rev-parse origin/page >/dev/null 2>&1; then
            git checkout origin/page -- data/json/versions/ 2>/dev/null || true
            if [ -d data/json/versions ]; then
              mkdir -p frontend/data/json
              cp -r data/json/versions frontend/data/json/
              rm -rf data
              echo "Restored $(ls frontend/data/json/versions/ | wc -l) version files"
            fi
          else
            echo "page branch not found"
          fi

      # ── Setup Go ────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version-file: data-cli/go.mod
          cache-dependency-path: data-cli/go.sum

      - name: data-cli unit tests
        run: make test-unit

      - name: data-cli integration tests
        run: make test-integration

      # ── Setup Node / pnpm ───────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate data
        env:
          OSH_GITHUB_TOKEN: ${{ secrets.OSH_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make data

      - name: Install frontend dependencies
        run: make install-ci

      - name: Sync public-service ads
        run: make ads-sync

      - name: Build frontend
        run: make build-ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: cd frontend && pnpm test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # ── Deploy to page branch (push to main only) ───────────────────
      - name: Deploy to page branch
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: page
          folder: frontend/dist
          clean: true
          single-commit: true
